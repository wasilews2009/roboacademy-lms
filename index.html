    const start=fd.get('start'),end=fd.get('end'),date=fd.get('date'),room=String(fd.get('room')||'').trim();
    if(toMin(end)<=toMin(start)){$('#oc-err').textContent='Кінець заняття має бути пізніше за початок.';return}
    if(f.dataset.extra){Object.assign(byId(state.extra,f.dataset.extra),{date,start,end,room})}
    else{const s=byId(state.slots,f.dataset.slot),k=s.id+'|'+f.dataset.od;
      if(date===f.dataset.od&&start===s.start&&end===s.end&&room===s.room)delete state.overrides[k];
      else state.overrides[k]={date,start,end,room:room||s.room}}
    save();closeModal();render();toast(f.dataset.extra?'Разове заняття оновлено':`Змінено лише на цей тиждень: ${fmtDate(date)}, ${start}`)},
  extra:(f,fd)=>{
    const start=fd.get('start'),end=fd.get('end');
    if(toMin(end)<=toMin(start)){$('#xf-err').textContent='Кінець заняття має бути пізніше за початок.';return}
    const g=group(fd.get('groupId'));
    state.extra.push({id:uid('ex'),groupId:g.id,date:fd.get('date'),start,end,room:String(fd.get('room')||'').trim()||g.room,note:String(fd.get('note')||'').trim()});
    save();closeModal();render();toast(`Разове заняття додано: ${fmtDate(fd.get('date'))}`)},
  muQuick:(f,fd)=>{const gid=fd.get('gid'),sid=fd.get('sid'),missed=fd.get('missed'),date=fd.get('date'),status=fd.get('status')||'done';
    if(!sid||!missed){$('#muq-err').textContent='Оберіть учня і пропущений урок.';return}
    if(status==='done'&&date>todayIso()){$('#muq-err').textContent='Проведеним можна позначити лише відпрацювання, яке вже відбулося. Для майбутньої дати оберіть «Заплановано».';return}
    if(makeupsOf({sid,gid,missed}).length){$('#muq-err').textContent='Цей пропуск уже має відпрацювання.';return}
    const mu={id:uid('mu'),studentId:sid,groupId:gid,missedDate:missed,price:lessonPrice(group(gid)),date,start:fd.get('start')||'',note:String(fd.get('note')||'').trim(),status};
    state.makeups.push(mu);save();closeModal();render();
    toast(status==='done'?`${shortName(student(sid))}: відпрацювання проведено, списано ${money(mu.price)}`:`${shortName(student(sid))}: відпрацювання заплановано на ${fmtDate(date)}`)},
  makeup:(f,fd)=>{
    const date=fd.get('date'),status=fd.get('status')||'planned';
    if(status==='done'&&date>todayIso()){$('#mu-err').textContent='Позначити проведеним можна в день відпрацювання або пізніше.';return}
    let mu=f.dataset.id&&byId(state.makeups,f.dataset.id);
    if(!mu){mu={id:uid('mu'),studentId:f.dataset.sid,groupId:f.dataset.gid,missedDate:f.dataset.missed,price:lessonPrice(group(f.dataset.gid))};state.makeups.push(mu)}
    Object.assign(mu,{date,start:fd.get('start')||'',note:String(fd.get('note')||'').trim(),status});
    save();closeModal();render();toast(status==='done'?`Відпрацювання проведено: списано ${money(mu.price)}`:`Відпрацювання призначено на ${fmtDate(date)}`)},
  move:(f,fd)=>{closeModal();transfer(f.dataset.sid,f.dataset.gid,fd.get('to'),fd.get('mode')==='copy')},
  slot:(f,fd)=>{
    const start=fd.get('start'),end=fd.get('end');
    if(toMin(end)<=toMin(start)){$('#slf-err').textContent='Кінець заняття має бути пізніше за початок.';return}
    const id=f.dataset.id,sl=id?byId(state.slots,id):{id:uid('sl')};
    Object.assign(sl,{groupId:fd.get('groupId'),wd:+fd.get('wd'),start,end,room:String(fd.get('room')||'').trim()||group(fd.get('groupId')).room});
    if(!id)state.slots.push(sl);
    const g=group(sl.groupId);
    const clash=state.slots.filter(o=>o.id!==sl.id&&o.wd===sl.wd&&toMin(o.start)<toMin(sl.end)&&toMin(sl.start)<toMin(o.end)&&group(o.groupId)&&(o.room===sl.room||(g.teacherId&&group(o.groupId).teacherId===g.teacherId)));
    save();closeModal();render();toast(id?'Розклад оновлено':'Заняття додано до розкладу');
    if(clash.length)toast(`Накладка: ${WD_FULL[sl.wd-1].toLowerCase()} ${clash[0].start}–${clash[0].end}, «${group(clash[0].groupId).name}» (та сама аудиторія або вчитель)`,'warn');
  },
  att:(f,fd)=>{
    const gid=f.dataset.gid,ds=f.dataset.date,marks={};
    for(const [k,v] of fd.entries())if(k.startsWith('m_')&&v)marks[k.slice(2)]=v;
    const topic=String(fd.get('topic')||'').trim(),key=gid+'|'+ds;
    if(Object.keys(marks).length||topic)state.attendance[key]={marks,topic,price:state.attendance[key]?.price??lessonPrice(group(gid))};else delete state.attendance[key];
    save();closeModal();render();
    const v=Object.values(marks);toast(`Відвідування збережено: присутні ${v.filter(x=>x!=='a').length} з ${v.length}`);
  },
  teacher:(f,fd)=>{
    const id=f.dataset.id;if(!isAdmin()&&(!id||id!==myTid())){toast('Редагувати можна лише власні дані','warn');return}
    const t=id?teacher(id):{id:uid('t')};
    if(CLOUD){const em=String(fd.get('accEmail')||'').trim().toLowerCase(),pw=String(fd.get('accPass')||'');
      if(isAdmin()&&(em||pw)){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){$('#tf-err').textContent='Вкажіть правильну пошту для входу.';return}
        if(pw.length<6){$('#tf-err').textContent='Пароль для входу має містити щонайменше 6 символів.';return}}
      ['name','spec','phone','email'].forEach(k=>t[k]=String(fd.get(k)||'').trim());
      if(!id)state.teachers.push(t);save();
      if(isAdmin()&&em){const b=f.querySelector('button[type=submit]');b.disabled=true;
        cloudCreateAccount(t,em,pw).then(()=>{closeModal();render();toast(`${t.name}: обліковий запис створено, вхід за поштою ${em}`)},
          e=>{b.disabled=false;$('#tf-err').textContent=accError(e)});return}
      closeModal();render();toast(id?'Дані вчителя оновлено':`${t.name} доданий до викладачів`);return}
    const login=String(fd.get('login')||'').trim(),pass=String(fd.get('password')||'');
    if(login&&state.users.some(u=>u.login===login&&u.teacherId!==t.id)){$('#tf-err').textContent='Такий логін уже зайнятий.';return}
    if(login&&!pass){$('#tf-err').textContent='Вкажіть пароль для входу.';return}
    ['name','spec','phone','email'].forEach(k=>t[k]=String(fd.get(k)||'').trim());
    if(!id)state.teachers.push(t);
    let u=state.users.find(x=>x.teacherId===t.id);
    if(login){if(!u){u={id:uid('u'),role:'teacher',teacherId:t.id};state.users.push(u)}u.login=login;u.password=pass}
    else if(u)state.users=state.users.filter(x=>x!==u);
    save();closeModal();render();toast(id?'Дані вчителя оновлено':`${t.name} доданий до викладачів`);
  },
  payout:(f,fd)=>{const ids=fd.getAll('t'),date=fd.get('date'),{y,m}=ui.sal,per=ymOf(y,m);
    if(!ids.length){toast('Позначте хоча б одного вчителя','warn');return}
    state.payouts=state.payouts||{};let total=0;
    ids.forEach(tid=>{const x=salaryOf(tid,y,m);state.payouts[tid+'|'+per]={date,ts:Date.now(),amount:x.pay};total+=x.pay});
    save();closeModal();render();toast(`Зарплату за ${MONTHS[m].toLowerCase()} виплачено ${ids.length} ${plural(ids.length,['вчителю','вчителям','вчителям'])}: ${money(total)}`)},
  payment:(f,fd)=>{
    const amount=Math.round(+fd.get('amount'));if(!(amount>0))return;
    if(!myStudent(fd.get('studentId'))){toast('Вносити оплату можна лише за учнів своїх груп','warn');return}
    const p={id:uid('p'),created:Date.now(),studentId:fd.get('studentId'),period:fd.get('period'),amount,date:fd.get('date'),method:fd.get('method'),note:String(fd.get('note')||'').trim()};p.split=splitAmount(amount,splitGids(state,p.studentId,p.period));
    state.payments.push(p);save();closeModal();render();toast(`Оплату ${money(amount)} зараховано: ${shortName(student(p.studentId))}`);
  }
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if($('#dp-pop')&&!e.target.closest('#dp-pop')&&!e.target.closest('.dp-btn'))dpClose();
  if($('#tp-pop')&&!e.target.closest('#tp-pop')&&e.target!==tp.inp)tpClose();
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#dp-pop')){dpClose();return}
  if(e.key==='Escape'&&$('#tp-pop')){tpClose();return}
  if(e.key==='Enter'&&$('#tp-pop')&&e.target===tp.inp){tpClose();return}
  if(e.key==='Escape'&&$('#modal-root').innerHTML){closeModal();return}
  if(e.key==='Escape'&&ui.doc){docClose();return}
  if(e.key==='Escape'&&ui.raceFull){raceFullOff();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[tabindex="0"][data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el)INPUT[el.dataset.input]?.(el,e)});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]');if(el)CHANGE[el.dataset.change]?.(el,e);
  if(e.target.name&&e.target.name.startsWith('m_'))attSummary();
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const miss=[...f.querySelectorAll('input[data-dp][required]')].find(x=>!x.value);if(miss){toast('Оберіть дату','warn');miss.nextElementSibling?.click();return}FORM[f.dataset.form]?.(f,new FormData(f))});

/* drag & drop between groups */
const dndOn=()=>ui.user&&isAdmin()&&ui.view==='groups';
document.addEventListener('dragstart',e=>{
  if(!dndOn())return;const c=e.target.closest&&e.target.closest('.schip');if(!c)return;
  ui.drag={sid:c.dataset.sid,from:c.dataset.from};
  try{e.dataTransfer.setData('text/plain',JSON.stringify(ui.drag));e.dataTransfer.effectAllowed='copyMove'}catch(_){}
  c.classList.add('dragging');
});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.drop-over').forEach(x=>x.classList.remove('dragging','drop-over'));ui.drag=null});
document.addEventListener('dragover',e=>{
  if(!dndOn()||!ui.drag)return;const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;
  if(z.dataset.drop==='pool'&&!ui.drag.from)return;
  e.preventDefault();
  try{e.dataTransfer.dropEffect=(e.ctrlKey||e.altKey||e.metaKey||!ui.drag.from)?'copy':'move'}catch(_){}
  document.querySelectorAll('.drop-over').forEach(x=>{if(x!==z)x.classList.remove('drop-over')});z.classList.add('drop-over');
});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drop-over')});
document.addEventListener('drop',e=>{
  if(!dndOn())return;const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();
  let d=ui.drag;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))||d}catch(_){}
  z.classList.remove('drop-over');ui.drag=null;
  if(d)transfer(d.sid,d.from,z.dataset.drop,e.ctrlKey||e.altKey||e.metaKey||!d.from);
});

render();
if(CLOUD)cloudInit();
})();
</script>

</html>
