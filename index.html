<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Академія робототехніки ПУЕТ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: fixed graphite sidebar on the left, working area on a cool mint-grey ground; students and groups as modules in auto-fill grids */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#E5ECEA; --fg:#132220; --muted:#5A6B67; --line:#D3DCD9;
  --accent:#0A7A73; --accent-ink:#FFFFFF; --accent-soft:#D3EEEA;
  --side-bg:#11201E; --side-fg:#C3D1CE; --side-dim:#7F928E; --side-active:#1F3632; --side-line:#24403C;
  --ok:#1D7F47; --ok-soft:#DAF1E3; --warn:#94600F; --warn-soft:#FAEBCF; --bad:#B8362F; --bad-soft:#F7DEDB;
  --on-sem:#FFFFFF; --overlay:rgba(8,20,18,.45); --shadow:0 1px 2px rgba(10,30,28,.06),0 6px 20px rgba(10,30,28,.07);
  --font-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --font-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --side-w:252px; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1514; --surface:#15201F; --surface-2:#1C2A28; --fg:#E3ECEA; --muted:#93A6A2; --line:#2A3B38;
  --accent:#3CC0B6; --accent-ink:#04201D; --accent-soft:#143935;
  --side-bg:#090F0E; --side-fg:#B8C8C4; --side-dim:#6E827E; --side-active:#18302C; --side-line:#1C2E2B;
  --ok:#55C987; --ok-soft:#14382A; --warn:#E6AE4E; --warn-soft:#3A2C12; --bad:#F07068; --bad-soft:#41201D;
  --on-sem:#0D1514; --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#15201F; --surface-2:#1C2A28; --fg:#E3ECEA; --muted:#93A6A2; --line:#2A3B38;
  --accent:#3CC0B6; --accent-ink:#04201D; --accent-soft:#143935;
  --side-bg:#090F0E; --side-fg:#B8C8C4; --side-dim:#6E827E; --side-active:#18302C; --side-line:#1C2E2B;
  --ok:#55C987; --ok-soft:#14382A; --warn:#E6AE4E; --warn-soft:#3A2C12; --bad:#F07068; --bad-soft:#41201D;
  --on-sem:#0D1514; --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.92em}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:transparent}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{width:auto;max-width:100%}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.form label > input,.form label > select,.form label > textarea{color:var(--fg);font-size:15px;font-weight:400;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
legend{font-size:13px;color:var(--muted);padding:0 4px;font-weight:500}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.form label.check{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:400;font-size:14px;cursor:pointer}
.check input,.form label.check > input{width:auto;flex:none;margin:0}
.form label{align-content:start}
kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.gchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 9px 3px 7px;border-radius:7px;background:var(--surface-2);max-width:100%}
.gchip i{width:8px;height:8px;border-radius:2px;background:var(--gc);flex:none}
.gchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ava{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;font-size:15px;flex:none;letter-spacing:.02em}
.ava.robot{background:linear-gradient(145deg,var(--accent-soft),var(--surface-2));color:var(--accent);border:1px solid var(--line)}
.ava.robot svg{width:72%;height:72%}
.ava.sm{width:24px;height:24px;border-radius:7px;font-size:11px}
.ava.lg{width:56px;height:56px;border-radius:15px;font-size:19px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px,var(--bg)}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);display:grid;gap:18px}
.login-card .logo{width:48px;height:48px;color:var(--accent)}
.login-card h1{font-family:var(--font-display);font-size:21px;line-height:1.25}
.login-card{position:relative}
.login-theme{position:absolute;top:12px;right:12px}
.login-theme span{display:none}
.login-err{color:var(--bad);font-size:13px;min-height:1em}
.demo{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:16px}
.demo-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer}
.demo-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.demo-btn b{font-weight:600}

/* shell */
.sidebar{position:fixed;inset:0 auto 0 0;width:calc(var(--side-w) + env(safe-area-inset-left,0px));background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;gap:18px;
  padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));z-index:40;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}
.brand svg{width:38px;height:38px;color:var(--accent);flex:none}
.brand b{display:block;font-family:var(--font-display);font-size:13px;line-height:1.25;color:#fff;letter-spacing:.01em}
:root[data-theme] .brand b{color:var(--side-fg)}
.brand span{font-size:11px;color:var(--side-dim);text-transform:uppercase;letter-spacing:.08em}
.nav{display:grid;gap:2px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-dim);padding:6px 10px 4px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:transparent;color:var(--side-fg);border-radius:9px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--side-active)}
.nav button.on{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav button .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--side-dim)}
.side-foot{margin-top:auto;display:grid;gap:10px;border-top:1px solid var(--side-line);padding-top:14px}
.me{display:flex;gap:10px;align-items:center;padding:0 4px}
.me b{display:block;font-size:14px;color:#fff;font-weight:600}
.me span{font-size:12px;color:var(--side-dim)}
.side-foot .row{display:flex;gap:6px}
.side-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:transparent;border:1px solid var(--side-line);color:var(--side-fg);border-radius:9px;padding:7px;cursor:pointer;font-size:13px}
.side-btn:hover{background:var(--side-active)}
.main{margin-left:calc(var(--side-w) + env(safe-area-inset-left,0px));min-height:100%;padding-block:26px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start;min-width:0}
.mobilebar{display:none}
.scrim{display:none}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.page-head h1{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.page-head p{color:var(--muted);margin-top:4px}
.page-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 240px;max-width:380px;display:block}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:36px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.hint svg{color:var(--accent);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.scroll-x{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}

/* students */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-items:start}
.st-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;min-width:0}
.st-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.st-top{display:flex;gap:11px;align-items:center;min-width:0}
.st-top > div{min-width:0;flex:1}
.st-top h3{font-size:15.5px;font-weight:600;line-height:1.25}
.st-top .muted{font-size:12.5px}
.st-meta{display:grid;gap:3px;margin:0;font-size:13px}
.st-meta div{display:flex;justify-content:space-between;gap:10px}
.st-meta dt{color:var(--muted)} .st-meta dd{margin:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.meter{flex:1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;min-width:40px}
.meter span{display:block;height:100%;background:var(--ok);border-radius:9px}
.meter span.mid{background:var(--warn)} .meter span.low{background:var(--bad)}

/* groups board */
.groups-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.pool{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;max-height:calc(100vh - 32px);overflow:auto}
.pool h2{font-size:14px;font-weight:600}
.pool .list{display:flex;flex-wrap:wrap;gap:6px}
.pool.drop-over{outline:2px dashed var(--bad);outline-offset:-2px}
.pool-sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.gmod{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;gap:12px;padding:14px;min-width:0;transition:background .15s,outline-color .15s}
.gmod.drop-over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.gmod-head{display:flex;gap:11px;align-items:flex-start}
.gmod-head > div{flex:1;min-width:0}
.gmod-head h3{font-size:15.5px;font-weight:600;line-height:1.25}
.swatch{width:30px;height:30px;border-radius:9px;background:var(--gc);flex:none;display:grid;place-items:center;color:#fff;font-family:var(--font-mono);font-size:11px;font-weight:600}
.facts{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.facts li{display:flex;gap:7px;align-items:center;min-width:0}
.facts li svg{width:15px;height:15px}
.facts li span{overflow:hidden;text-overflow:ellipsis}
.fill{display:flex;align-items:center;gap:10px}
.fill .meter span{background:var(--gc)}
.fill .meter span.over{background:var(--bad)}
.dropzone{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;align-content:flex-start;padding:8px;border-radius:10px;background:var(--surface-2)}
.empty-drop{padding:6px;color:var(--muted);font-size:13px}
.schip{display:inline-flex;align-items:center;gap:6px;padding:3px 3px 3px 3px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:13px;max-width:100%;user-select:none}
.schip[draggable="true"]{cursor:grab}
.schip.dragging{opacity:.4}
.schip .nm{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.schip .nm:hover{text-decoration:underline}
.schip .multi{font-family:var(--font-mono);font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 4px}
.chip-btn{display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.chip-btn:hover{background:var(--surface-2);color:var(--fg)}
.chip-btn svg{width:14px;height:14px}
.gmod footer{display:flex;gap:8px;flex-wrap:wrap}

/* timetable */
.tt{display:grid;grid-template-columns:52px repeat(7,minmax(118px,1fr));min-width:900px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tt-hd{padding:9px 8px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;text-align:center;background:var(--surface)}
.tt-hd small{display:block;font-weight:400;color:var(--muted);font-family:var(--font-mono);font-size:11px}
.tt-hd.today{color:var(--accent)}
.tt-times{position:relative;border-right:1px solid var(--line)}
.tt-times span{position:absolute;right:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted);transform:translateY(-50%)}
.tt-day{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hpx)}
.tt-day.today{background-color:var(--accent-soft)}
.tt-block{position:absolute;border:0;border-radius:8px;padding:5px 7px;text-align:left;cursor:pointer;overflow:hidden;background:var(--surface);box-shadow:inset 3px 0 0 var(--gc),0 0 0 1px var(--line);font-size:12px;line-height:1.3;display:grid;align-content:start;gap:1px}
.tt-block:hover{box-shadow:inset 3px 0 0 var(--gc),0 0 0 1.5px var(--gc)}
.tt-block b{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--muted)}
.tt-block strong{font-weight:600;font-size:12.5px}
.tt-block.dim{opacity:.35}
.tt-block.alarm{box-shadow:inset 3px 0 0 var(--bad),0 0 0 1.5px var(--bad);background:var(--bad-soft)}
.tt-block .shelter{display:flex;gap:4px;align-items:flex-start;color:var(--bad);font-weight:600;font-size:11.5px}
.tt-block .shelter svg{width:13px;height:13px;flex:none;margin-top:1px}
.tt-block s{font-size:11px}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.mnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mnav b{font-family:var(--font-display);font-size:15px;font-weight:500;min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-wd{padding:8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.cal-day{min-height:112px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;background:var(--surface)}
.cal-day:nth-child(7n+1){border-left:0}
.cal-day:hover{background:var(--surface-2)}
.cal-day.out{background:var(--bg);color:var(--muted)}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-num{font-family:var(--font-mono);font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cal-day.today .cal-num b{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px}
.cal-dots{display:none;gap:3px;flex-wrap:wrap}
.cal-dots i{width:7px;height:7px;border-radius:50%;background:var(--gc)}
.lp{display:flex;gap:5px;align-items:center;border:0;background:var(--surface-2);border-radius:6px;padding:2px 6px;font-size:11.5px;cursor:pointer;text-align:left;min-width:0;width:100%}
.lp i{width:6px;height:6px;border-radius:50%;background:var(--gc);flex:none}
.lp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.lp .st{margin-left:auto;flex:none;width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--muted)}
.lp .st.done{background:var(--ok);border-color:var(--ok)} .lp .st.part{background:var(--warn);border-color:var(--warn)} .lp .st.todo{border-color:var(--bad)}
.lp:hover{outline:1px solid var(--gc)}
.more{font-size:11px;color:var(--muted);padding-left:6px}
.day-panel{position:sticky;top:16px}
.lesson{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.lesson + .lesson{margin-top:10px}
.lesson-top{display:flex;gap:10px;align-items:flex-start}
.lesson-top > div{flex:1;min-width:0}
.lesson-top b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .st{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.legend .st.done{background:var(--ok);border-color:var(--ok)} .legend .st.part{background:var(--warn);border-color:var(--warn)} .legend .st.todo{border-color:var(--bad)}

/* attendance */
.att-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.att-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:9px;background:var(--surface-2)}
.att-list .who{display:flex;align-items:center;gap:8px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg label{display:block !important;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.seg span{display:block;padding:5px 10px;font-size:12.5px;color:var(--muted);font-weight:500;border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked + span{color:var(--on-sem)}
.seg .v-p input:checked + span{background:var(--ok)} .seg .v-l input:checked + span{background:var(--warn)} .seg .v-a input:checked + span{background:var(--bad)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
.seg input:disabled + span{cursor:not-allowed;opacity:.7}
.att-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.today-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;background:var(--surface)}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center;white-space:nowrap}
.mx thead th{font-weight:600;font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--surface)}
.mx thead th.future{opacity:.55}
.mx thead th button{border:0;background:transparent;cursor:pointer;color:inherit;font:inherit;display:grid;gap:0;line-height:1.2;padding:2px 4px;border-radius:6px;margin:auto}
.mx thead th button:hover{background:var(--surface-2);color:var(--fg)}
.mx th.nm,.mx td.nm{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px}
.mx td.nm{font-weight:500}
.mx tfoot td{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);border-bottom:0}
.mk{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:12px;color:var(--muted)}
.mk.p{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.mk.l{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.mk.a{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.mk[disabled]{cursor:default;opacity:.45}
.wrap-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

/* payments & reports */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile b{font-family:var(--font-display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile small{font-size:12px;color:var(--muted)}
.tile.bad b{color:var(--bad)} .tile.ok b{color:var(--ok)}
table.tb{border-collapse:collapse;width:100%;font-size:14px}
.tb th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb td.num,.tb th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tb .who{display:flex;gap:9px;align-items:center;cursor:pointer;min-width:170px}
.tb .who:hover b{text-decoration:underline}
.tb .who b{font-weight:500}
.seg-f{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-f button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:13.5px;color:var(--muted);border-left:1px solid var(--line)}
.seg-f button:first-child{border-left:0}
.seg-f button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,170px) 1fr 52px;gap:10px;align-items:center;font-size:13px}
.hbar .lbl{display:flex;gap:7px;align-items:center;min-width:0}
.hbar .lbl i{width:8px;height:8px;border-radius:2px;background:var(--gc);flex:none}
.hbar .lbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trk{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .trk span{display:block;height:100%;background:var(--gc);border-radius:6px}
.hbar .v{text-align:right;font-family:var(--font-mono);font-size:12px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.cur{fill:var(--accent);opacity:1}
.chart .bar.past{opacity:.55}
.chart .val{fill:var(--fg);font-weight:600}
.list-rows{display:grid}
.list-rows > div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list-rows > div:last-child{border-bottom:0}

/* teachers */
.t-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.t-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.t-stats div{background:var(--surface-2);border-radius:9px;padding:8px 4px}
.t-stats b{display:block;font-family:var(--font-display);font-weight:500;font-size:18px}
.t-stats span{font-size:11.5px;color:var(--muted)}

/* photo, contacts, birthdays */
img.ava{object-fit:cover;background:var(--surface-2);padding:0}
.phone-btn{border:0;background:transparent;padding:0;cursor:pointer;color:var(--accent);font-family:var(--font-mono);font-size:.92em;text-decoration:underline dotted;text-underline-offset:3px}
.phone-btn:hover{text-decoration-style:solid}
.contact-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.contact-acts a,.contact-acts button{display:flex;align-items:center;gap:10px;justify-content:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);text-decoration:none;color:var(--fg);font-weight:500;background:var(--surface);cursor:pointer}
.contact-acts a:hover,.contact-acts button:hover{border-color:var(--accent)}
.contact-acts .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;background:var(--c)}
.contact-acts .ic svg{width:15px;height:15px}
.contact-num{font-family:var(--font-mono);font-size:20px;letter-spacing:.02em;user-select:all}
.bday{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.bday svg{width:14px;height:14px}
.bday.today{background:var(--accent);color:var(--accent-ink)}
.age-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.age-line b{font-weight:600;color:var(--fg)}
.no{font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:0 5px}
.payer{display:grid;gap:10px}
.tg-checks{display:grid;gap:6px}
.btn.busy{opacity:.7;pointer-events:none}
.tg-checks .check{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
a.btn{text-decoration:none}
.photo-field{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo-field .ava{width:76px;height:76px;border-radius:18px;font-size:24px}
.photo-field input[type=file]{display:none}
.rem{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);cursor:pointer;border:0;width:100%;text-align:left}
.rem:hover{outline:1px solid var(--accent)}
.rem.new{box-shadow:inset 3px 0 0 var(--warn)}
.rem > div{flex:1;min-width:0}
.rem b{font-weight:600}
.rem-list{display:grid;gap:8px}
.rem-banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.rem-banner > svg{color:var(--warn)}
.rem-banner .names{flex:1;min-width:200px}
.bell-dot{min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px;font-family:var(--font-mono);margin-left:auto}
.icon-btn{position:relative}
.icon-btn .bell-dot{position:absolute;top:-3px;right:-3px;margin:0}

/* alarm, weekly schedule, make-ups, salary */
.alarm-banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--bad);color:var(--on-sem);border-radius:12px;padding:12px 16px}
.alarm-banner > svg{width:22px;height:22px}
.alarm-banner > div{flex:1;min-width:200px}
.alarm-banner .btn{background:var(--on-sem);color:var(--bad);border-color:transparent}
.nav button.alarm-on{background:var(--bad);color:var(--on-sem)}
.shelter{color:var(--bad);font-weight:600}
.tt-block.cancel{opacity:.6;text-decoration:line-through;background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px)}
.tt-block.changed{box-shadow:inset 3px 0 0 var(--gc),0 0 0 1.5px var(--warn)}
.tt-block em{font-style:normal;font-size:11px;color:var(--warn);font-weight:600;text-decoration:none}
.wk{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wk b{font-family:var(--font-display);font-weight:500;font-size:15px;min-width:180px;text-align:center}
.mk.mu-plan{box-shadow:0 0 0 2px var(--warn)}
.mk.mu-done{background:var(--ok-soft);color:var(--ok);border:1px dashed var(--ok)}
.pill-btn{border:0;cursor:pointer;font:inherit;font-size:12px}
.inline-set{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.inline-set input{width:96px}
.acc-in{width:110px !important;margin-left:8px;padding:4px 8px}
.tb tfoot td{border-top:1px solid var(--line);border-bottom:0;padding:9px 12px}
.mu-list{display:grid;gap:8px}

/* modal & toast */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:130;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .15s ease-out}
.dialog{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:100%;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid;gap:16px;align-content:start}
.dialog.wide{max-width:760px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-head h2{font-family:var(--font-display);font-size:18px;font-weight:500;line-height:1.3}
.dlg-head p{color:var(--muted);font-size:13.5px;margin-top:3px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.dlg-actions .spacer{margin-right:auto}
.sec{display:grid;gap:8px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;font-size:14px}
.kv div{display:grid}
.kv span{font-size:12px;color:var(--muted)}
.mg-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2);flex-wrap:wrap}
.mg-row > div{flex:1;min-width:150px}
.mg-row b{font-weight:600;font-size:14px}
.inline-add{display:flex;gap:8px;flex-wrap:wrap}
.inline-add select{flex:1;min-width:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{display:block !important}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches span{display:block;width:28px;height:28px;border-radius:8px;background:var(--c);cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatches input:checked + span{border-color:var(--surface);box-shadow:0 0 0 2px var(--fg)}
.swatches input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:200;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);animation:up .2s ease-out}
.toast.warn{background:var(--warn);color:var(--on-sem)}
/* grades journal, race and rating */
.race-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.race-sub{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.lanes{display:grid;gap:6px}
.lane{display:grid;grid-template-columns:26px minmax(110px,170px) minmax(0,1fr) 52px 38px;gap:10px;align-items:center;font-size:13.5px}
.lane .pos{font-family:var(--font-mono);font-weight:600;color:var(--muted);text-align:center}
.lane.p1 .pos{color:var(--warn)}
.lane .who{display:flex;gap:8px;align-items:center;min-width:0;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.lane .who span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .who:hover span:last-child{text-decoration:underline}
.lane .pts{font-family:var(--font-mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.trk{position:relative;height:30px;border-radius:8px;background:var(--surface-2) linear-gradient(90deg,var(--line) 50%,transparent 0) 0 50%/16px 2px repeat-x;overflow:hidden}
.trk .fin{position:absolute;top:0;bottom:0;width:8px;left:calc(40px + (100% - 48px) * var(--g));background:conic-gradient(var(--fg) 25%,var(--surface) 0 50%,var(--fg) 0 75%,var(--surface) 0) 0 0/8px 8px;opacity:.55}
.run{position:absolute;left:0;top:0;bottom:0;width:calc(40px + (100% - 40px) * var(--f));background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gc) 30%,transparent));display:flex;justify-content:flex-end;align-items:center;animation:drive 1.2s cubic-bezier(.2,.7,.2,1) both}
.run svg{width:36px;height:18px;color:var(--gc);flex:none;margin-right:2px}
@keyframes drive{from{width:40px}}
.delta{font-family:var(--font-mono);font-size:12px;text-align:center;color:var(--muted);white-space:nowrap}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.feed{display:grid;max-height:470px;overflow:auto}
.feed-item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:0}
.feed-item .em{font-size:18px;line-height:34px;text-align:center;width:34px;height:34px;border-radius:9px;background:var(--surface-2)}
.feed-item b{font-weight:600;font-size:13.5px}
.feed-item p{font-size:12.5px;color:var(--muted);margin-top:2px}
.feed-item .side{display:grid;justify-items:end;gap:4px}
.ptag{font-family:var(--font-mono);font-weight:600;font-size:12.5px;color:var(--ok);white-space:nowrap}
.ptag.neg{color:var(--bad)}
.cfg-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gr{min-width:30px;height:28px;padding:0 5px;border-radius:8px;border:1px solid transparent;font:600 12.5px var(--font-mono);cursor:pointer;position:relative;background:var(--surface-2);color:var(--fg)}
.gr.hi{background:var(--ok-soft);color:var(--ok)} .gr.mid{background:var(--warn-soft);color:var(--warn)} .gr.lo{background:var(--bad-soft);color:var(--bad)}
.gr.none{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:400}
.gr[disabled]{cursor:default;opacity:.45}
.gr .bn{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.gr-abs{color:var(--muted);font-size:12px}
.gl-list{display:grid;gap:10px;max-height:min(58vh,560px);overflow:auto;padding:2px}
.gl-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.gl-row.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.gl-row.off{opacity:.55}
.gl-who{display:flex;gap:10px;align-items:center;min-width:0}
.gl-who b{font-weight:500;display:block}
.gl-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gl-in label.cm{grid-column:1/-1}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--fg)}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.event-card{text-align:center;display:grid;gap:8px;justify-items:center;padding:20px 16px;border-radius:var(--r);background:var(--surface-2);border:2px dashed var(--line)}
.event-card .em{font-size:46px;line-height:1;animation:roll .6s ease-out}
.event-card h3{font-family:var(--font-display);font-size:18px;font-weight:500}
.event-card p{color:var(--muted);max-width:420px}
@keyframes roll{from{transform:rotate(-200deg) scale(.4);opacity:0}}
.opt-list{display:grid;gap:6px}
.form .disc{display:flex;gap:8px;flex-wrap:wrap}
.form .disc label.check{position:relative;padding:7px 18px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-family:var(--font-mono)}
.form .disc input{position:absolute;opacity:0;pointer-events:none}
.form .disc label.check:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.form .disc label.check:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt-list label.check{padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.opt-list label.check b{margin-left:auto}
.opt-list label.check.off{opacity:.5;cursor:not-allowed}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;max-width:620px;width:100%;margin-inline:auto}
.pod{display:grid;justify-items:center;gap:5px;text-align:center;min-width:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}
.pod .nm{font-weight:600;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:10px 10px 0 0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:500 22px var(--font-display);margin-top:4px}
.pod.n1 .blk{height:112px;background:var(--warn-soft);color:var(--warn)} .pod.n2 .blk{height:82px} .pod.n3 .blk{height:60px}
.pod .ava.lg{width:64px;height:64px}
.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.gift{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:3px;background:var(--surface)}
.gift svg.i{color:var(--accent);width:22px;height:22px;margin-bottom:4px}
.gift b{font-weight:600}
.gift .cost{font-family:var(--font-mono);font-size:13px;color:var(--accent);font-weight:600}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--accent);width:var(--p)}
.next-gift{display:grid;gap:4px;min-width:150px;font-size:12px;color:var(--muted)}
.pill.gold{background:var(--warn);color:var(--on-sem)}
.mu-skip summary{cursor:pointer;font-size:13px;color:var(--muted);margin-top:6px}
.mu-skip .mu-list{margin-top:8px}
.pay-pick{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.tb tr.repay td{background:var(--accent-soft)}
.mu-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
@media (max-width:700px){.mu-cols{grid-template-columns:minmax(0,1fr)}}
/* Ukrainian date picker (native pickers follow the browser language) */
.dp-btn{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:15px;font-weight:400;cursor:pointer;text-align:left}
.dp-btn:hover{border-color:var(--accent)}
.dp-btn.empty span{color:var(--muted)}

const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* light/dark theme: an explicit choice is kept on this device, otherwise the system setting applies */
const THEME_KEY='roboacademy-lms-theme';
const darkNow=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches};
function applyTheme(){const t=store.get(THEME_KEY);if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
applyTheme();
const themeBtn=(cls='')=>{const d=darkNow();return `<button type="button" class="${cls}" data-act="toggleTheme" aria-label="${d?'Увімкнути світлу тему':'Увімкнути темну тему'}" title="${d?'Світла тема':'Темна тема'}">${icon(d?'sun':'moon')}<span>${d?'Світла тема':'Темна тема'}</span></button>`};
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const T0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const todayIso=()=>iso(T0());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wdOf=d=>(d.getDay()+6)%7+1;
const ymOf=(y,m)=>`${y}-${pad(m+1)}`;
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const byId=(arr,id)=>arr.find(x=>x.id===id);
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const WD_FULL=['Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота','Неділя'];
const MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MONTHS_GEN=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MONTHS_SHORT=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const PALETTE=['#0A7A73','#D27A22','#3B6FD4','#B5487A','#5E8F2A','#7A5BC4','#C24A3A','#2A8BA6'];
const money=n=>new Intl.NumberFormat('uk-UA').format(Math.round(n||0))+' грн';
const plural=(n,[one,few,many])=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b===1)return one;if(b>=2&&b<=4)return few;return many};
const fmtDate=(ds,withYear)=>{const d=parse(ds);return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${withYear?' '+d.getFullYear():''}`};
const fmtShort=ds=>{const d=parse(ds);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}`};
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const coll=new Intl.Collator('uk');

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeEvent(ev,gid,ds,order,R){
  const n=order.length;if(!n)return null;const pick=a=>a[Math.floor(R()*a.length)];let sids;
  switch(ev.who){
    case 'last':sids=[order[n-1]];break;
    case 'lead':sids=[order[0]];break;
    case 'all':sids=order.slice();break;
    case 'two':{const a=order.slice();sids=[];while(sids.length<Math.min(2,n))sids.push(a.splice(Math.floor(R()*a.length),1)[0]);break}
    case 'bottomOne':sids=[pick(order.slice(Math.floor(n/2)))];break;
    case 'bottomAll':sids=order.slice(Math.floor(n/2));break;
    default:sids=[pick(order)];

/* birthdays & reminders */
function nextBirthday(b){
  if(!b)return null;const d=parse(b),t=T0();
  let n=new Date(t.getFullYear(),d.getMonth(),d.getDate());
  if(n<t)n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());
  return {days:Math.round((n-t)/864e5),date:n,turns:n.getFullYear()-d.getFullYear()};
}
const turnsText=n=>`${n} ${plural(n,['рік','роки','років'])}`;
function bdayWhen(r){
  if(r.days===0)return 'сьогодні';
  if(r.days===1)return 'завтра';
  if(r.days===7)return `через тиждень, ${fmtDate(iso(r.date))}`;
  return `через ${r.days} ${plural(r.days,['день','дні','днів'])}, ${fmtDate(iso(r.date))}`;
}
/* reminder windows: a week before (shown days 7..2), the day before, and the day itself */
function reminders(){
  const out=[];
  visibleStudents().forEach(s=>{
    const r=nextBirthday(s.birth);if(!r||r.days>7)return;
    const type=r.days===0?'today':r.days===1?'day':'week';
    const key=`${ui.user.id}|${s.id}|${r.date.getFullYear()}|${type}`;
    out.push({s,...r,type,key,seen:!!state.seen[key]});
  });
  return out.sort((a,b)=>a.days-b.days);
}
const unseenCount=()=>reminders().filter(r=>!r.seen).length;
function bdayBadge(s){
  const r=nextBirthday(s.birth);if(!r||r.days>7)return '';
  return `<span class="bday ${r.days===0?'today':''}" title="День народження ${fmtDate(iso(r.date))}: виповниться ${turnsText(r.turns)}">${icon('cake')}${r.days===0?'ДН сьогодні':r.days===1?'ДН завтра':`ДН через ${r.days} дн.`}</span>`;
}

function resizeImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();
      img.onload=()=>{const S=320,c=document.createElement('canvas');c.width=c.height=S;
        const k=Math.max(S/img.width,S/img.height),w=img.width*k,h=img.height*k;
        c.getContext('2d').drawImage(img,(S-w)/2,(S-h)/2,w,h);res(c.toDataURL('image/jpeg',.82))};
      img.onerror=rej;img.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---------- cloud: Firebase Auth for sign-in, Firestore as the shared database ----------

   A save sends only the keys that changed, merged in a transaction with what others changed meanwhile:
   lists of records merge by id, maps (attendance, grades…) by entry, so two teachers marking different lessons don't overwrite each other. */
const cloud={ready:false,empty:false,err:'',denied:'',raw:{},n:{},q:Promise.resolve(),greet:false};
let fbApp,auth,db,cloudUnsub=[];
const CHUNK=300000;
/* written by the administrator only (the database rules refuse them to teachers) */
const ADMIN_KEYS=['payouts','salaryAdj','users'];
function loadScript(src){return new Promise((ok,no)=>{const el=document.createElement('script');el.src=src;el.onload=ok;el.onerror=no;document.head.appendChild(el)})}
async function fbLoad(){

  }
  throw new Error('sdk');
}
async function cloudInit(){
  try{await fbLoad()}catch(e){cloud.err='Не вдалося завантажити Firebase. Перевірте підключення до інтернету й оновіть сторінку.';render();return}
  fbApp=firebase.initializeApp(FB_CONFIG);auth=fbApp.auth();db=fbApp.firestore();
  if(EMU){auth.useEmulator('http://127.0.0.1:9099');db.useEmulator('127.0.0.1',8080)}
  auth.onAuthStateChanged(cloudUser);
}

async function cloudUser(u){
  cloudUnsub.forEach(f=>f());cloudUnsub=[];cloud.raw={};cloud.n={};cloud.empty=false;cloud.err='';ui.roles={};
  if(!u){ui.user=null;state=emptyState();_mc={};cloud.ready=true;render();return}
  cloud.ready=false;render();
  const email=(u.email||'').toLowerCase();let role=null;
  if(OWNER_EMAILS.includes(email))role={role:'admin'};
  else{try{const d=await db.doc('roles/'+u.uid).get();if(d.exists)role=d.data()}catch(e){}}
  if(!role){cloud.denied=email;cloud.ready=true;ui.user=null;render();auth.signOut();return}
  cloud.denied='';
  ui.user={id:u.uid,role:role.role==='admin'?'admin':'teacher',teacherId:role.teacherId||'',login:email,email,name:role.name||'Адміністратор'};
  const v=store.get(SESSION_KEY+':view');if(v)ui.view=v;
  if(isAdmin())cloudUnsub.push(db.collection('roles').onSnapshot(sn=>{ui.roles={};sn.forEach(d=>{ui.roles[d.id]=d.data()});if(ui.view==='teachers')softRender()},()=>{}));
  let first=true;
  cloudUnsub.push(db.collection('lms').onSnapshot(sn=>{cloudSnap(sn,first);first=false},
    e=>{cloud.err='Немає доступу до бази даних ('+(e.code||e.message)+'). Перевірте правила доступу Firestore.';cloud.ready=true;render()}));
}
function cloudSnap(sn,first){
  const parts={};
  sn.forEach(d=>{const [k,i]=d.id.split('~');(parts[k]=parts[k]||[])[+(i||0)]=d.data()});
  const raw={},n={};
  for(const k of Object.keys(parts)){const ps=parts[k],h=ps[0];if(!h)continue;const cnt=h.n||1;
    if(ps.length<cnt||ps.slice(0,cnt).some(x=>!x))continue;   /* a long value mid-update: wait for all its parts */
    raw[k]=ps.slice(0,cnt).map(x=>x.v).join('');n[k]=cnt}
  for(const k of new Set([...Object.keys(raw),...Object.keys(cloud.raw)])){

function merge3(B,L,S){
  const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const recs=x=>Array.isArray(x)&&x.every(e=>obj(e)&&typeof e.id==='string');
  if(recs(B)&&recs(L)&&recs(S)){
    const bm=new Map(B.map(e=>[e.id,JSON.stringify(e)])),lm=new Set(L.map(e=>e.id));
    const out=S.filter(e=>!(bm.has(e.id)&&!lm.has(e.id)));
    const at=new Map(out.map((e,i)=>[e.id,i]));
    L.forEach(e=>{if(bm.get(e.id)===JSON.stringify(e))return;if(at.has(e.id))out[at.get(e.id)]=e;else{at.set(e.id,out.length);out.push(e)}});
    return out;
  }
  if(obj(B)&&obj(L)&&obj(S)){
    const out={...S};
    for(const k of Object.keys(B))if(!(k in L))delete out[k];
    for(const k of Object.keys(L))if(JSON.stringify(L[k])!==JSON.stringify(B[k]))out[k]=L[k];
    return out;
  }
  return L;
}
function writeKey(w,k,str,oldN){
  const col=db.collection('lms'),ps=[];
  if(str!==undefined)for(let i=0;i===0||i*CHUNK<str.length;i++)ps.push(str.slice(i*CHUNK,(i+1)*CHUNK));
  ps.forEach((v,i)=>w.set(col.doc(i?k+'~'+i:k),i?{v}:{v,n:ps.length,t:Date.now(),by:ui.user?.email||''}));
  for(let i=ps.length;i<(oldN||0);i++)w.delete(col.doc(i?k+'~'+i:k));
}
function cloudPush(){
  if(!CLOUD||!cloud.ready||!ui.user||cloud.empty||!db)return;
  const jobs=[];
  for(const k of Object.keys(state)){if(k[0]==='_'||(!isAdmin()&&ADMIN_KEYS.includes(k)))continue;const j=JSON.stringify(state[k]);if(j!==cloud.raw[k])jobs.push({k,base:cloud.raw[k],local:j})}
  for(const k of Object.keys(cloud.raw))if(!(k in state))jobs.push({k,base:cloud.raw[k],local:undefined});
  if(!jobs.length)return;
  cloud.q=cloud.q.then(()=>Promise.all(jobs.map(pushKey))).catch(e=>toast('Зміни не збережено в базі: '+(e.code==='permission-denied'?'недостатньо прав':e.code||e.message)+'. Спробуйте ще раз.','warn'));
}
function pushKey({k,base,local}){
  const ref=db.collection('lms').doc(k);
  return db.runTransaction(async tx=>{
    const h=await tx.get(ref);const n=h.exists?(h.data().n||1):0;let cur=h.exists?h.data().v:undefined;
    for(let i=1;i<n;i++){const d=await tx.get(db.collection('lms').doc(k+'~'+i));cur+=d.exists?d.data().v:''}
    let out=local;
    if(local!==undefined&&cur!==undefined&&base!==undefined&&cur!==base)out=JSON.stringify(merge3(JSON.parse(base),JSON.parse(local),JSON.parse(cur)));
    if(out===cur)return;
    writeKey(tx,k,out,n);
  });
}

}

function sChip(sid,gid){

function groupModule(g){

  const ini=g.name.replace(/[^A-Za-zА-ЯІЇЄҐа-яіїєґ0-9 ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

    <header class="gmod-head"><span class="swatch">${esc(ini)}</span><div><h3>${esc(g.name)}</h3><p class="muted small">${esc(g.course)} · ${esc(g.ages)} років</p></div>${isAdmin()?`<button type="button" class="icon-btn" data-act="editGroup" data-id="${g.id}" aria-label="Редагувати групу">${icon('edit')}</button>`:''}</header>

    <div class="fill"><div class="meter"><span class="${n>cap?'over':''}" style="width:${Math.min(100,n/cap*100)}%"></span></div><span class="mono small">${n}/${cap}</span></div>
    <div class="dropzone">${g.studentIds.map(sid=>sChip(sid,g.id)).join('')||'<p class="empty-drop">Перетягніть сюди учнів</p>'}</div>
    <footer>${btn('Відвідування','goAttendance','sm','check',`data-gid="${g.id}"`)}${btn('Розклад','goSchedule','sm ghost','schedule',`data-gid="${g.id}"`)}</footer>
  </section>`;
}
function transfer(sid,from,to,copy){
  const s=student(sid); if(!s||from===to)return;
  const src=from?group(from):null,name=shortName(s);
  if(to==='pool'){
    if(!src)return;
    src.studentIds=src.studentIds.filter(x=>x!==sid);
    toast(`${name}: виписано з «${src.name}»`);
  }else{
    const tg=group(to); if(!tg)return;
    if(tg.studentIds.includes(sid)){
      if(src&&!copy){src.studentIds=src.studentIds.filter(x=>x!==sid);toast(`${name} уже був у «${tg.name}», тому лише виписаний з «${src.name}»`)}
      else{toast(`${name} уже навчається в «${tg.name}»`,'warn');return}
    }else{
      tg.studentIds.push(sid);
      if(src&&!copy){src.studentIds=src.studentIds.filter(x=>x!==sid);toast(`${name} переведено з «${src.name}» до «${tg.name}»`)}
      else toast(`${name} тепер також навчається в «${tg.name}»`);
      if(tg.studentIds.length>tg.capacity)toast(`Група «${tg.name}» переповнена: ${tg.studentIds.length} з ${tg.capacity}`,'warn');
    }
  }
  save(); render();
}

/* ---------- schedule ---------- */
VIEWS.schedule=()=>{
  const admin=isAdmin(),START=8,END=21,HPX=54,tpl=ui.f.schMode==='tpl';
  const mine=!admin&&ui.f.tView==='mine';
  const okG=g=>g&&(!mine||g.teacherId===myTid())&&(!ui.f.schT||g.teacherId===ui.f.schT)&&(!ui.f.schG||g.id===ui.f.schG);
  const mon=parse(ui.f.schWeek),days=[0,1,2,3,4,5,6].map(i=>iso(addDays(mon,i)));
  const hours=[];for(let h=START;h<=END;h++)hours.push(h);
  const H=(END-START)*HPX;
  let total=0,mins=0;
  const cols=days.map((ds,i)=>{
    const items=tpl?state.slots.filter(s=>s.wd===i+1&&okG(group(s.groupId))).map(s=>({...s,slotId:s.id}))
      :[...lessonsOn(ds).filter(l=>okG(group(l.groupId))),...cancelledOn(ds).filter(l=>okG(group(l.groupId)))];
    items.sort((a,b)=>toMin(a.start)-toMin(b.start));
    const lanes=[];items.forEach(it=>{let l=lanes.findIndex(e=>e<=toMin(it.start));if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=toMin(it.end);it._l=l});
    const n=Math.max(1,lanes.length),w=100/n;
    return `<div class="tt-day ${!tpl&&ds===todayIso()?'today':''}" style="height:${H}px;--hpx:${HPX}px">${items.map(it=>{
      const g=group(it.groupId),off=it.cancelled||it.movedTo;
      if(!off){total++;mins+=toMin(it.end)-toMin(it.start)}
      const top=(toMin(it.start)-START*60)/60*HPX,h=Math.max(26,(toMin(it.end)-toMin(it.start))/60*HPX-3);
      const cls=[!admin&&g.teacherId!==myTid()?'dim':'',off?'cancel':'',state.alarm&&!off?'alarm':'',!off&&(it.changed||it.extra)?'changed':''].join(' ');
      const note=it.cancelled?'Скасовано':it.movedTo?`Перенесено на ${fmtShort(it.movedTo)}`:it.extra?(it.note||'Разове заняття'):it.moved?`Перенесено з ${fmtShort(it.origDate)}`:it.changed?'Змінено цього тижня':'';
      const room=roomOf(it);
      return `<button type="button" class="tt-block ${cls}" style="--gc:${g.color};top:${top+1}px;height:${h}px;left:calc(${it._l*w}% + 3px);width:calc(${w}% - 6px)" data-act="ttClick" data-slot="${it.slotId||''}" data-extra="${it.extraId||''}" data-od="${tpl?'':(it.origDate||ds)}" title="${esc(g.name)} · ${it.start}–${it.end} · ${esc(room)}${note?' · '+note:''}"><b>${it.start}–${it.end}</b>${state.alarm&&!off?`<span class="shelter">${icon('shield')}${esc(room)}</span><strong>${esc(g.name)}</strong><s class="muted small">${esc(it.room||g.room||'')}</s>`:`<strong>${esc(g.name)}</strong><span class="muted">${esc(room)}</span>`}${note?`<em>${esc(note)}</em>`:''}</button>`;
    }).join('')}</div>`;
  });
  const sun=addDays(mon,6);
  return `${pageHead('Розклад',tpl?`Постійний розклад · ${total} ${plural(total,['заняття','заняття','занять'])}, ${String(mins/60).replace('.',',')} год на тиждень`:`Тиждень ${mon.getDate()} ${MONTHS_GEN[mon.getMonth()]} – ${sun.getDate()} ${MONTHS_GEN[sun.getMonth()]} · ${total} ${plural(total,['заняття','заняття','занять'])}`,admin?btn('Постійне заняття','addSlot',tpl?'primary':'','plus')+(tpl?'':btn('Разове заняття','addExtra','primary','plus')):'')}
  <p class="hint">${icon('schedule')}<span>Постійний розклад автоматично повторюється на кожен новий тиждень. Перенесення, скасування й разові заняття змінюють лише обраний тиждень і не впливають на інші.${admin?' Щоб змінити заняття тільки цього тижня, натисніть на нього у вкладці «Тиждень».':''}</span></p>
  <div class="toolbar">
    <div class="seg-f" role="group" aria-label="Вигляд"><button type="button" class="${tpl?'':'on'}" data-act="schMode" data-v="week">Тиждень</button><button type="button" class="${tpl?'on':''}" data-act="schMode" data-v="tpl">Постійний розклад</button></div>
    ${tpl?'':`<div class="wk"><button type="button" class="icon-btn" data-act="wk" data-v="-7" aria-label="Попередній тиждень">${icon('left')}</button><b>${mon.getDate()} ${MONTHS_GEN[mon.getMonth()]} – ${sun.getDate()} ${MONTHS_GEN[sun.getMonth()]}</b><button type="button" class="icon-btn" data-act="wk" data-v="7" aria-label="Наступний тиждень">${icon('right')}</button><button type="button" class="btn sm ghost" data-act="wk" data-v="0">Поточний</button></div>`}
  </div>
  <div class="toolbar">
    ${!admin?`<div class="seg-f" role="group" aria-label="Показати"><button type="button" class="${mine?'on':''}" data-act="tView" data-v="mine">Мої групи</button><button type="button" class="${!mine?'on':''}" data-act="tView" data-v="all">Уся Академія</button></div>`:''}
    ${admin||!mine?`<select id="f-sch-t" data-change="schT" aria-label="Учитель"><option value="">Усі вчителі</option>${state.teachers.map(x=>`<option value="${x.id}" ${ui.f.schT===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}
    <select id="f-sch-g" data-change="schG" aria-label="Група"><option value="">Усі групи</option>${(mine?visibleGroups():state.groups).map(g=>`<option value="${g.id}" ${ui.f.schG===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>
  </div>
  <div class="scroll-x"><div class="tt">
    <div class="tt-hd"></div>${WD_FULL.map((d,i)=>`<div class="tt-hd ${!tpl&&days[i]===todayIso()?'today':''}">${d}${tpl?'':`<small>${fmtShort(days[i])}</small>`}</div>`).join('')}
    <div class="tt-times" style="height:${H}px">${hours.map(h=>`<span style="top:${(h-START)*HPX}px">${pad(h)}:00</span>`).join('')}</div>
    ${cols.join('')}
  </div></div>`;
};

  <p class="hint">${state_}</p>

    ${admin&&s?btn('Змінити постійний розклад','editSlot','ghost','schedule',`data-id="${s.id}"`):''}
    ${admin&&s&&o?btn(cancelled?'Повернути заняття':'Повернути як у постійному','occReset','ghost','reset',`data-slot="${s.id}" data-od="${od}"`):''}
    ${admin&&s&&!cancelled?`<button type="button" class="btn danger" data-act="occCancel" data-slot="${s.id}" data-od="${od}">Скасувати лише цього тижня</button>`:''}

  </div>`);
}

/* ---------- calendar ---------- */
VIEWS.calendar=()=>{
  const {y,m,sel}=ui.cal,gids=visibleGroups().map(g=>g.id);
  const first=new Date(y,m,1),start=addDays(first,-(wdOf(first)-1));
  const last=new Date(y,m+1,0),end=addDays(last,7-wdOf(last));
  const cells=[];
  for(let d=start;d<=end;d=addDays(d,1)){
    const ds=iso(d),ls=lessonsOn(ds,gids),out=d.getMonth()!==m;
    cells.push(`<div class="cal-day ${out?'out':''} ${ds===todayIso()?'today':''} ${ds===sel?'sel':''}" data-act="selDay" data-date="${ds}" role="button" tabindex="0" aria-label="${fmtDate(ds)}, ${ls.length} ${plural(ls.length,['заняття','заняття','занять'])}">
      <div class="cal-num"><b>${d.getDate()}</b>${ls.length?`<span class="muted" style="font-weight:400">${ls.length}</span>`:''}</div>
      ${ls.slice(0,4).map(l=>{const g=group(l.groupId);return `<button type="button" class="lp" style="--gc:${g.color}" data-act="openLesson" data-gid="${g.id}" data-date="${ds}"><i></i><em>${l.start}</em><span>${esc(g.name)}</span><b class="st ${lessonState(g.id,ds)}"></b></button>`}).join('')}
      ${ls.length>4?`<span class="more">ще ${ls.length-4}</span>`:''}
      <div class="cal-dots">${ls.map(l=>`<i style="--gc:${group(l.groupId).color}"></i>`).join('')}</div>
    </div>`);
  }
  const dl=lessonsOn(sel,gids);
  return `${pageHead('Календар','Розклад по днях. Натисніть на заняття, щоб відмітити присутніх.')}
  <div class="toolbar" style="justify-content:space-between">${monthNav('cal')}<div class="legend"><span><i class="st done"></i>Відмічено</span><span><i class="st part"></i>Частково</span><span><i class="st todo"></i>Не відмічено</span><span><i class="st"></i>Заплановано</span></div></div>
  <div class="cal-wrap">
    <div class="cal">${WD.map(d=>`<div class="cal-wd">${d}</div>`).join('')}${cells.join('')}</div>
    <aside class="panel day-panel"><h2>${WD_FULL[wdOf(parse(sel))-1]}, ${fmtDate(sel)}</h2>
      ${dl.length?dl.map(l=>lessonCard(l.groupId,sel,l)).join(''):'<p class="muted">Цього дня занять немає.</p>'}
      ${(()=>{const mus=state.makeups.filter(mu=>mu.date===sel&&gids.includes(mu.groupId));return mus.length?`<div class="sec" style="margin-top:12px"><h3>Відпрацювання</h3><div class="mu-list">${mus.map(mu=>makeupRow(mu,true)).join('')}</div></div>`:''})()}
    </aside>
  </div>`;
};
function lessonCard(gid,ds,sl){
  const g=group(gid),t=teacher(g.teacherId),st=lessonState(gid,ds),rec=attRec(gid,ds);
  const pres=rec?Object.values(rec.marks).filter(v=>v==='p'||v==='l').length:0;
  const label={done:['ok',`Присутні ${pres} з ${g.studentIds.length}`],part:['warn',`Відмічено частково`],todo:['bad','Не відмічено'],future:['','Заплановано']}[st];
  return `<div class="lesson" style="--gc:${g.color}"><div class="lesson-top"><span class="swatch" style="width:12px;height:36px;border-radius:4px"></span><div><b>${esc(g.name)}</b><div class="small muted">${sl.start}–${sl.end} · ${state.alarm?`<span class="shelter">${esc(shelterOf(g))}</span>`:esc(sl.room)} · ${esc(t?.name||'—')}</div>${state.alarm?'':`<div class="small muted">Укриття: ${esc(shelterOf(g))}</div>`}${sl.extra?'<div class="small"><span class="pill warn">разове заняття</span></div>':sl.changed?'<div class="small"><span class="pill warn">змінено цього тижня</span></div>':''}${rec?.topic?`<div class="small">Тема: ${esc(rec.topic)}</div>`:''}</div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="pill ${label[0]}">${label[1]}</span>${st!=='future'&&canMark(gid)?btn(st==='todo'?'Відмітити':'Змінити','openLesson','sm primary','check',`data-gid="${gid}" data-date="${ds}"`):st!=='future'?btn('Переглянути','openLesson','sm','',`data-gid="${gid}" data-date="${ds}"`):''}</div></div>`;
}

/* attendance modal */
function openLesson(gid,ds){
  const g=group(gid); if(!g)return;
  const sl=lessonsOn(ds).find(l=>l.groupId===gid)||{start:'',end:'',room:g.room};
  const rec=attRec(gid,ds)||{marks:{},topic:''};
  const roster=[...g.studentIds,...Object.keys(rec.marks).filter(id=>!g.studentIds.includes(id)&&student(id))];
  const future=ds>todayIso(),editable=canMark(gid)&&!future;
  const why=future?'Відмітити присутніх можна в день заняття або пізніше.':!canMark(gid)?'Відмічати присутніх може вчитель цієї групи або адміністратор.':'';

function openAbsences(gid,sid){
  const out=[],g=group(gid);if(!g)return out;
  for(const k in state.attendance){const i=k.indexOf('|');if(k.slice(0,i)!==gid)continue;const ds=k.slice(i+1),marks=state.attendance[k].marks;
    for(const id in marks){if(marks[id]!=='a'||(sid&&id!==sid)||state.muSkip?.[muKey(id,gid,ds)])continue;const st=student(id);if(!st||st.status==='expelled')continue;if(!makeupsOf({sid:id,gid,missed:ds}).length)out.push({s:st,ds})}}
  return out.sort((a,b)=>b.ds.localeCompare(a.ds)||byName(a.s,b.s));
}

/* ---------- performance reports: parents' report, report card, summaries ---------- */
const inPeriod=(ds,P)=>(!P.from||ds>=P.from)&&(!P.to||ds<=P.to);
function periodOf(key,from,to){
  const t=T0(),y=t.getFullYear(),m=t.getMonth(),sy=m>=8?y:y-1;
  switch(key){
    case 'month':return {from:iso(new Date(y,m,1)),to:iso(new Date(y,m+1,0)),label:`${MONTHS[m]} ${y}`};
    case 'prev':{const d=new Date(y,m-1,1);return {from:iso(d),to:iso(new Date(d.getFullYear(),d.getMonth()+1,0)),label:`${MONTHS[d.getMonth()]} ${d.getFullYear()}`}}
    case 's1':return {from:`${sy}-09-01`,to:`${sy}-12-31`,label:`I семестр ${sy}/${sy+1} н. р.`};
    case 's2':return {from:`${sy+1}-01-01`,to:`${sy+1}-05-31`,label:`II семестр ${sy}/${sy+1} н. р.`};
    case 'year':return {from:`${sy}-09-01`,to:`${sy+1}-08-31`,label:`${sy}/${sy+1} навчальний рік`};
    case 'all':return {from:'',to:'',label:'за весь час навчання'};
    default:return {from,to,label:`${fmtDate(from,true)} – ${fmtDate(to,true)}`};
  }
}
const ACH=p=>p==null?'—':p>=.83?'Високий':p>=.58?'Достатній':p>=.33?'Середній':'Початковий';
const dTier=p=>p==null?'none':p>=.75?'hi':p>=.5?'mid':'lo';
const pctTxt=p=>p==null?'—':Math.round(p*100)+'%';
const num1=v=>v==null?'—':(Math.round(v*10)/10).toString().replace('.',',');
/* one student in one group over a period: every lesson, grades by criterion, comments, attendance, race points */
function perfOf(sid,gid,P){
  const g=group(gid),cfg=cfgOf(g),dates=new Set();
  for(const k in state.attendance){const i=k.indexOf('|');if(k.slice(0,i)===gid&&inPeriod(k.slice(i+1),P)&&state.attendance[k].marks[sid])dates.add(k.slice(i+1))}
  for(const k in state.grades){const i=k.indexOf('|');if(k.slice(0,i)===gid&&inPeriod(k.slice(i+1),P)&&state.grades[k].m[sid])dates.add(k.slice(i+1))}
  let present=0,total=0,points=0;const rows=[...dates].sort().map(ds=>{
    const mark=attRec(gid,ds)?.marks[sid]||'',rec=state.grades[gid+'|'+ds],r=rec?.m[sid],max=rec?.max||cfg.max,avg=gradeCell(r);
    if(mark){total++;if(mark!=='a')present++}
    if(r)points+=gradePts(r,max);
    return {ds,mark,r,max,avg,p:avg==null?null:avg/max}});
  const awards=state.awards.filter(a=>a.gid===gid&&inPeriod(a.date,P)).flatMap(a=>a.hits.filter(h=>h.sid===sid).map(h=>({a,points:+h.points||0})));
  awards.forEach(x=>points+=x.points);
  const graded=rows.filter(x=>x.p!=null),pct=graded.length?graded.reduce((a,x)=>a+x.p,0)/graded.length:null;
  const crit=cfg.criteria.map(c=>{const v=rows.filter(x=>x.r&&x.r.v[c.id]!=null).map(x=>x.r.v[c.id]/x.max);return {c,p:v.length?v.reduce((a,x)=>a+x,0)/v.length:null}});
  return {g,cfg,rows,present,total,att:total?present/total:null,pct,avg:pct==null?null:pct*cfg.max,crit,points,awards};
}
function groupsFor(sid,P){
  const ids=new Set(groupsOf(sid).map(g=>g.id));
  for(const k in state.grades)if(state.grades[k].m[sid]){const gid=k.slice(0,k.indexOf('|'));if(inPeriod(k.slice(k.indexOf('|')+1),P))ids.add(gid)}
  return [...ids].map(group).filter(Boolean).filter(g=>isAdmin()||canMark(g.id)||groupsOf(sid).includes(g));
}
function groupPerf(gid,P){
  const g=group(gid),ids=new Set(g.studentIds);
  for(const k in state.grades){const i=k.indexOf('|');if(k.slice(0,i)===gid&&inPeriod(k.slice(i+1),P))Object.keys(state.grades[k].m).forEach(x=>ids.add(x))}
  const list=[...ids].map(student).filter(s=>s&&s.status!=='expelled').map(s=>({s,...perfOf(s.id,gid,P)})).sort((a,b)=>b.points-a.points||byName(a.s,b.s));
  const lessons=Object.keys(state.attendance).filter(k=>{const i=k.indexOf('|');return k.slice(0,i)===gid&&inPeriod(k.slice(i+1),P)}).length;
  const pr=list.reduce((a,x)=>a+x.present,0),tt=list.reduce((a,x)=>a+x.total,0),gr=list.filter(x=>x.pct!=null);
  const crit=cfgOf(g).criteria.map(c=>{const v=list.map(x=>x.crit.find(y=>y.c.id===c.id)?.p).filter(v=>v!=null);return {c,p:v.length?v.reduce((a,x)=>a+x,0)/v.length:null}});
  const awards=state.awards.filter(a=>a.gid===gid&&inPeriod(a.date,P));
  return {g,list,lessons,att:tt?pr/tt:null,pct:gr.length?gr.reduce((a,x)=>a+x.pct,0)/gr.length:null,points:list.reduce((a,x)=>a+x.points,0),crit,bonuses:awards.filter(a=>a.kind==='bonus').length,events:awards.filter(a=>a.kind==='event').length};
}

/* accountant's monthly report: money received in the month (by payment date); each payment is divided equally between the student's groups, so it lands with their teachers */
function acctData(per){
  const {from,to}=perRange(per),cov=coverage(),tOf=gid=>group(gid)?.teacherId||'',T={};
  const row=(tid,s)=>{const t=T[tid]=T[tid]||{tid,rows:{}};return t.rows[s.id]=t.rows[s.id]||{s,paid:0,debt:0}};
  state.students.forEach(s=>{
    if(discountAt(s,to)===100)return;
    const ps=state.payments.filter(p=>p.studentId===s.id&&p.date>=from&&p.date<=to);
    ps.forEach(p=>{const sp=splitOf(p),ks=Object.keys(sp);if(!ks.length){row('',s).paid+=+p.amount||0;return}ks.forEach(gid=>{row(tOf(gid),s).paid+=sp[gid]})});
    cov.filter(x=>x.sid===s.id&&x.ds<=to&&(!x.at||x.at>to)).forEach(x=>{row(tOf(x.gid),s).debt+=x.amt});
    chargesOf(s.id,{from,to}).forEach(c=>row(tOf(c.gid),s));
    if(s.status!=='expelled'&&(s.joined||'')<=to)groupsOf(s.id).forEach(g=>row(g.teacherId,s));
  });
  const order=[...state.teachers.map(t=>t.id),''];
  return order.filter(id=>T[id]).map(id=>{const rows=Object.values(T[id].rows).sort((a,b)=>byName(a.s,b.s));
    return {t:teacher(id),rows,paid:rows.reduce((a,r)=>a+r.paid,0),debt:rows.reduce((a,r)=>a+r.debt,0),debtors:rows.filter(r=>r.debt>0).length}});
}

function sigImage(file){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const k=Math.min(1,600/img.width,240/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    for(let i=0;i<p.length;i+=4){const l=(p[i]+p[i+1]+p[i+2])/3;if(l>215)p[i+3]=0;else if(l>160)p[i+3]=Math.round(p[i+3]*(215-l)/55)}
    x.putImageData(d,0,0);res(c.toDataURL('image/png'))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)});
}

const loadLib=(()=>{const p={};return u=>p[u]||(p[u]=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=u;sc.onload=ok;sc.onerror=()=>{delete p[u];no(new Error('lib'))};document.head.appendChild(sc)}))})();
async function saveFile(filename,blob){
  try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){await d.save({filename,data:blob});toast('Файл збережено');return}}}
  catch(e){if(e&&e.code==='declined'){toast('Збереження скасовано');return}if(e&&e.code==='rate_limited'){toast('Зачекайте кілька секунд і спробуйте ще раз','warn');return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
async function exportDoc(kind,el){
  const d=$('#doc');if(!d||!ui.doc)return;
  const label=el.innerHTML;el.disabled=true;el.innerHTML='<span>Готую файл…</span>';
  try{
    await loadLib(LIBS.h2c);if(kind==='pdf')await loadLib(LIBS.pdf);
    const z=d.style.zoom;d.style.zoom=1;
    if(d.classList.contains('certs')){
      try{const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',orientation:'landscape'}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),cs=[...d.querySelectorAll('.cert')];
        for(let i=0;i<cs.length;i++){el.innerHTML=`<span>Готую ${i+1} з ${cs.length}…</span>`;const cv=await window.html2canvas(cs[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',.9),'JPEG',0,0,pw,ph)}
        await saveFile(ui.doc.file+'.pdf',pdf.output('blob'))}finally{d.style.zoom=z}
      return}
    const top=d.getBoundingClientRect().top,W=d.offsetWidth,H=d.offsetHeight;
    const cuts=[...d.querySelectorAll('tbody tr:not(:first-child),tfoot tr,h2,h3,.d-kpis,.d-grid2,.d-sign,.d-hero,.d-note,.d-kv,.d-title-c,.doc-foot')].map(x=>x.getBoundingClientRect().top-top).filter(v=>v>0);
    let canvas;try{canvas=await window.html2canvas(d,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false})}finally{d.style.zoom=z}
    if(kind==='png'){const blob=await new Promise(ok=>canvas.toBlob(ok,'image/png'));await saveFile(ui.doc.file+'.png',blob);return}
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=28,k=pw/W,sc=canvas.width/W;
    let y=0,page=0;
    while(y<H-1){
      const offs=page?m:0,avail=(ph-offs-m)/k;let end=y+avail;
      if(end<H){const c=cuts.filter(v=>v>y+avail*.45&&v<=end);if(c.length)end=Math.max(...c)}else end=H;
      const sl=document.createElement('canvas');sl.width=canvas.width;sl.height=Math.max(1,Math.round((end-y)*sc));
      const cx=sl.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,sl.width,sl.height);cx.drawImage(canvas,0,Math.round(y*sc),canvas.width,sl.height,0,0,canvas.width,sl.height);
      if(page)pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',.92),'JPEG',0,offs,pw,(end-y)*k);
      if(page){pdf.setFontSize(8);pdf.setTextColor(122,135,156);pdf.text(String(page+1),pw-m,ph-12,{align:'right'})}
      y=end;page++;
    }
    await saveFile(ui.doc.file+'.pdf',pdf.output('blob'));
  }catch(e){toast('Не вдалося підготувати файл. Перевірте підключення до інтернету й спробуйте ще раз.','warn')}
  finally{if(el.isConnected){el.disabled=false;el.innerHTML=label}}
}

  const rows=state.students.filter(s=>myStudent(s.id)).map(s=>{const cs=chargesOf(s.id,rng);return {s,lessons:cs.length,charged:sumPrice(cs),paid:paidFor(s.id,per),bal:balanceOf(s.id)}})
    .filter(r=>r.lessons||r.paid||r.bal||(r.s.status!=='expelled'&&groupsOf(r.s.id).length));
  const tot={charged:rows.reduce((a,r)=>a+r.charged,0),lessons:rows.reduce((a,r)=>a+r.lessons,0),paid:rows.reduce((a,r)=>a+r.paid,0),
    debt:rows.reduce((a,r)=>a+Math.max(0,-r.bal),0),debtors:rows.filter(r=>r.bal<0).length,pre:rows.reduce((a,r)=>a+Math.max(0,r.bal),0)};

  const pays=state.payments.filter(p=>p.period===per&&myStudent(p.studentId)).sort((a,b)=>b.date.localeCompare(a.date));
  return `${pageHead('Плата за навчання',isAdmin()?'Оплати зараховуються на баланс учня. За кожен відвіданий урок з балансу списується його вартість.':'Ви бачите учнів своїх груп і можете вносити їхні оплати. Видаляти платежі може лише адміністратор.',btn('Внести оплату','addPayment','primary','plus'))}
  <div class="toolbar">${monthNav('pay')}</div>

function revenueChart(){
  const {y,m}=ui.rep,data=[];
  for(let k=5;k>=0;k--){const d=new Date(y,m-k,1),per=ymOf(d.getFullYear(),d.getMonth());data.push({lbl:MONTHS_SHORT[d.getMonth()],v:state.payments.filter(p=>p.period===per).reduce((a,p)=>a+p.amount,0),cur:k===0})}
  const W=560,H=230,L=58,Rr=10,Tp=22,B=28,max=Math.max(1,...data.map(d=>d.v));
  const raw=max/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),nr=raw/mag,step=(nr<=1?1:nr<=2?2:nr<=2.5?2.5:nr<=5?5:10)*mag,top=Math.ceil(max/step)*step;
  const ys=v=>Tp+(H-Tp-B)*(1-v/top),bw=(W-L-Rr)/data.length;
  let g='';for(let v=0;v<=top+1e-6;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${L-8}" y="${ys(v)+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString('uk-UA')+' тис':v}</text>`;
  const bars=data.map((d,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,yv=ys(d.v);return `<rect class="bar ${d.cur?'cur':'past'}" x="${x}" y="${yv}" width="${w}" height="${Math.max(0,H-B-yv)}" rx="4"/><text class="val" x="${x+w/2}" y="${yv-6}" text-anchor="middle">${(d.v/1000).toLocaleString('uk-UA',{maximumFractionDigits:1})}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${d.lbl}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Надходження оплат за останні 6 місяців, тисяч гривень">${g}${bars}</svg><p class="small muted">Тисяч гривень, за місяцем навчання. Темніший стовпчик — обраний місяць.</p>`;
}

  let pop=$('#tp-pop');if(!pop){pop=document.createElement('div');pop.id='tp-pop';pop.className='dp-pop tp-pop';pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Вибір часу');document.body.appendChild(pop)}
  const C=120,pos=(n,r)=>{const a=n*Math.PI/6;return [C+r*Math.sin(a),C-r*Math.cos(a)]},H=tp.mode==='h';
  let nums='',sel;

  const r=tp.inp.getBoundingClientRect(),h=pop.offsetHeight,w=pop.offsetWidth;
